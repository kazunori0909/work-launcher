# 動作確認用のサンプル案件の設定（書き方は docs/config.md）

version: 1
title: Sample Project
style: launcher/style.css

# 外部に開いてよい URL のスキーム。省略時は [http, https, mailto]。
# file を消すと、下の「file: のリンク」は開けなくなる（url はコンソールにエラー、リンクは押しても何も起きない）
openSchemes: [http, https, mailto, file]

#--------------------------------------
# PC, Macの情報
#--------------------------------------
info:
  env: [PATH, JAVA_HOME]
  tools: [git, node, python, java, steam, epic]
  registry: # Windowsのみ
    - HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem\LongPathsEnabled
    - name: Windows Ver.
      path: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\DisplayVersion
    - name: UEインストールパス
      path: HKEY_LOCAL_MACHINE\SOFTWARE\EpicGames\Unreal Engine\INSTALLDIR

#--------------------------------------
# ページ設定
#--------------------------------------
pages:
  #
  # メインページ
  #
  - id: main
    title: メイン
    icon: house
    items:
      # URL検索や開く系のサンプル
      - heading: 開く
      - url: https://www.google.com/search
        params:
          q: ほげほげ
        icon: search
      - open: launcher
      - break:

      # file: のリンクと URL（最上位の openSchemes で file を許可している）
      - heading: "file: のリンク"
      - md: |
          - Windows: [メモ帳](file:///C:/Windows/System32/notepad.exe)
          - Mac: [hosts](file:///etc/hosts)
      - url: file:///C:/Windows/System32/notepad.exe
        label: "メモ帳（Windows）"
        icon: notepad-text
      - url: file:///etc/hosts
        label: "hosts（Mac）"
        icon: file-text
      - break:

      # ボタングループ: ファイル名のボタンの横に操作ボタンを添える
      - buttons:
        - excel: docs/サンプル 仕様書.xlsx
          readonly: true
        - excel: docs/サンプル 仕様書.xlsx
          label: ""
          icon: pencil-line
          tooltip: 編集モードで開く
      # 事前作成しているスクリプトファイルの呼び出しサンプル
      # launcher/scripts/sample-scripts.js に hello() と slowCount() が定義されている
      - heading: sample-scripts.js
      - function: hello
      - function: slowCount

  # 別ファイルからページ追加
  - include: launcher/pages/sample-page.yaml

  # ヘルプ
  - id: help
    items:
      - md: |
          この案件のヘルプです。設定に `id: help` のページを書くと、ヘルプの最初の章に出ます。
