# サンプルページ: グループ・ボタングループ・select などの書き方の見本
# 画面に出す文字は { ja: …, en: … } でも書ける（右上で選んだ言語で出る。表に無い言語なら表の最初）。
# このページでは、タブ名と選択（select・radio・checkbox）の部分だけを英語にしている
id: sample
title: { ja: サンプル, en: Sample }
icon: flask-conical
items:
  #--------------------------------------
  # コマンド（bat・sh・powershell・python）
  #--------------------------------------
  # 枠で囲むグループ。中にボタングループや select も置ける
  - group: コマンド
    icon: terminal
    items:
      - bat: |
          @echo off
          echo こんにちは、bat です（%DATE% %TIME%）
        label: bat
        tooltip: Windows だけで動く
      - sh: echo "こんにちは、sh です（$(date '+%Y/%m/%d %H:%M:%S')）"
        label: sh
        tooltip: Windows では Git Bash で動く
      - powershell: |
          Write-Output "こんにちは、PowerShell $($PSVersionTable.PSVersion) です"
          Write-Output "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Output "日時: $(Get-Date -Format 'yyyy/MM/dd HH:mm:ss')"
        label: PowerShell
        tooltip: Mac では pwsh（PowerShell 7）が要る
      - python: |
          import datetime, platform
          print(f"こんにちは、Python {platform.python_version()} です")
          print(f"OS: {platform.system()} {platform.release()}")
          print(f"日時: {datetime.datetime.now():%Y/%m/%d %H:%M:%S}")
        label: Python
      - break
      - sh: |
          echo "cwd: $(pwd)"
          echo "HOME: ${HOME}"
        bat: |
          @echo off
          echo cwd: %CD%
        label: 作業フォルダを表示
      - { sh: ls, bat: dir /b, cwd: launcher, label: 設定フォルダの中身（cwd 指定） }
      - sh: |
          echo "入力待ちの前"
          read -p "続けるには Enter: " answer
          echo "入力待ちの後"
        bat: |
          @echo off
          echo 入力待ちの前
          pause
          echo 入力待ちの後
        label: 入力待ちを含む
      - break
      - sh: |
          echo "WARN: これは警告"
          echo "ERROR: これは失敗"
          exit 1
        bat: |
          @echo off
          echo WARN: これは警告
          echo ERROR: これは失敗
          exit /b 1
        label: 失敗する
      - sh: |
          for i in $(seq 1 30); do echo "$i"; sleep 1; done
          echo done
        bat: |
          @echo off
          for /l %%i in (1,1,30) do (
            echo %%i
            ping -n 2 127.0.0.1 > nul
          )
          echo done
        label: 長い処理（停止の確認用）
        confirm: 30 秒かかります。実行しますか？

  #--------------------------------------
  # 資料（ファイルを開く・ボタングループ）
  #--------------------------------------
  - group: 資料
    icon: folder
    items:
      # ボタングループ: ファイル名のボタンの横に操作ボタンを添える
      - buttons:
          - { excel: docs/サンプル 仕様書.xlsx, readonly: true }
          - excel: docs/サンプル 仕様書.xlsx
            label: ''
            icon: pencil-line
            tooltip: 編集モードで開く
      - buttons:
          - { word: docs/サンプル 手順書.docx, readonly: true }
          - word: docs/サンプル 手順書.docx
            label: ''
            icon: pencil-line
            tooltip: 編集モードで開く
  - break

  #--------------------------------------
  # デプロイ（select・radio・checkbox）
  #--------------------------------------
  # 選んだ値は、コマンドでは ${select:ID}、JS では ctx.select.ID で使う
  - group: { ja: デプロイ, en: Deploy }
    icon: upload
    items:
      # 地域を先に選ぶ。変えると、接続先を初期値に戻す（sample-scripts.js の onRegionChange）
      - select: region
        label: { ja: 地域, en: Region }
        options: # 表示と値を分ける
          - { label: { ja: 東京, en: Tokyo }, value: tokyo }
          - { label: { ja: 大阪, en: Osaka }, value: osaka }
        remember: true # 開き直しても前の選択を使う
        change: onRegionChange
      - sh: echo "./deploy.sh --region=${select:region} --target=${select:target} --mode=${select:mode} ${select:dry}"
        bat: |
          @echo off
          echo deploy.bat --region=${select:region} --target=${select:target} --mode=${select:mode} ${select:dry}
        label: { ja: デプロイ, en: Deploy }
        icon: upload
        confirm:
          ja: ${select:region} の ${select:target} にデプロイしますか？
          en: Deploy to ${select:target} in ${select:region}?
      - break
      - select: target
        label: { ja: 接続先, en: Target }
        options: [dev, stg, prod] # 値だけ書く（表示も同じ）
      - radio: mode
        label: { ja: モード, en: Mode }
        options: [debug, release]
      - checkbox: dry
        label: { ja: 試しに実行, en: Dry run }
        on: --dry-run # オンのときの値
        off: '' # オフのときの値（空）
      # 接続先・モード・試しに実行を、まとめて変える・戻す
      - buttons:
          - function: releasePreset # JS から値を変える（ctx.set）
            label: { ja: 本番向けにする, en: Set for release }
            icon: rocket
            tooltip: { ja: prod・release・試しに実行オン, en: 'prod, release, dry run on' }
          - reset: [target, mode, dry] # YAML だけで初期値に戻す
            label: ''
            tooltip: { ja: 初期値に戻す, en: Reset }

  #--------------------------------------
  # デバッグ（押せる・押せないの条件・リセット）
  #--------------------------------------
  # モードが debug のときだけ使う設定。YAML の disabledWhen・enabledWhen・reset だけで書く
  - group: { ja: デバッグ, en: Debug }
    id: debug-tools
    icon: bug
    disabledWhen: { mode: release } # モードが release の間は、中の項目ごと押せない
    items:
      - select: log-level
        label: { ja: ログ出力レベル, en: Log level }
        options: [low, middle, high]
        default: middle
      - checkbox: log-file
        label: { ja: ファイルにも書く, en: Also to a file }
        on: debug.log # オンのときは、ログを debug.log にも書く
        off: ''
      - sh: echo "$(date '+%H:%M:%S') log-level=${select:log-level}" | tee -a ${select:log-file}
        bat: |
          @echo off
          echo %TIME% log-level=${select:log-level}
          if not "${select:log-file}"=="" echo %TIME% log-level=${select:log-level}>> ${select:log-file}
        label: { ja: デバッグ起動, en: Start debug }
        icon: play
      - open: debug.log
        label: { ja: ログを開く, en: Open log }
        enabledWhen: { log-file: true } # ファイルに書くときだけ押せる
      # グループの中の値を初期値に戻す（label・icon は既定のもの）
      - { reset: debug-tools, label: '' }
  - break

  #--------------------------------------
  # md のコード
  #--------------------------------------
  # md のコードブロック: 言語を書くと色が付く（yaml・json・sh・powershell・bat など）
  - group: md のコード
    icon: code
    items:
      - md: |
          インラインの `--border` はそのまま、ブロックは言語ごとに色が付きます。

          ```yaml
          title: 案件名 # コメント
          items:
            - sh: echo "hello"
          ```

          ```powershell
          Write-Output "日時: $(Get-Date -Format 'yyyy/MM/dd')"
          ```

          ```bat
          @echo off
          rem コメント
          echo %DATE%
          ```

          ```
          言語を書かないブロックは単色
          ```
