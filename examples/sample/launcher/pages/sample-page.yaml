# サンプルページ: グループ・ボタングループ・select などの書き方の見本
id: sample
title: サンプル
icon: flask-conical
items:
  # 枠で囲むグループ。中にボタングループや select も置ける
  - group: コマンド
    icon: terminal
    items:
      - bat: |
          @echo off
          echo こんにちは、bat です（%DATE% %TIME%）
        label: bat
        tooltip: Windows だけで動く
      - sh: echo "こんにちは、sh です（$(date '+%Y/%m/%d %H:%M:%S')）"
        label: sh
        tooltip: Windows では Git Bash で動く
      - powershell: |
          Write-Output "こんにちは、PowerShell $($PSVersionTable.PSVersion) です"
          Write-Output "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Output "日時: $(Get-Date -Format 'yyyy/MM/dd HH:mm:ss')"
        label: PowerShell
        tooltip: Mac では pwsh（PowerShell 7）が要る
      - python: |
          import datetime, platform
          print(f"こんにちは、Python {platform.python_version()} です")
          print(f"OS: {platform.system()} {platform.release()}")
          print(f"日時: {datetime.datetime.now():%Y/%m/%d %H:%M:%S}")
        label: Python
      - break
      - sh: |
          echo "cwd: $(pwd)"
          echo "HOME: ${HOME}"
        bat: |
          @echo off
          echo cwd: %CD%
        label: 作業フォルダを表示
      - sh: ls
        bat: dir /b
        cwd: launcher
        label: 設定フォルダの中身（cwd 指定）
      - sh: |
          echo "入力待ちの前"
          read -p "続けるには Enter: " answer
          echo "入力待ちの後"
        bat: |
          @echo off
          echo 入力待ちの前
          pause
          echo 入力待ちの後
        label: 入力待ちを含む
      - break
      - sh: |
          echo "WARN: これは警告"
          echo "ERROR: これは失敗"
          exit 1
        bat: |
          @echo off
          echo WARN: これは警告
          echo ERROR: これは失敗
          exit /b 1
        label: 失敗する
      - sh: |
          for i in $(seq 1 30); do echo "$i"; sleep 1; done
          echo done
        bat: |
          @echo off
          for /l %%i in (1,1,30) do (
            echo %%i
            ping -n 2 127.0.0.1 > nul
          )
          echo done
        label: 長い処理（停止の確認用）
        confirm: 30 秒かかります。実行しますか？

  - group: 資料
    icon: folder
    items:
      # ボタングループ: ファイル名のボタンの横に操作ボタンを添える
      - buttons:
          - excel: docs/サンプル 仕様書.xlsx
            readonly: true
          - excel: docs/サンプル 仕様書.xlsx
            label: ''
            icon: pencil-line
            tooltip: 編集モードで開く
      - buttons:
          - word: docs/サンプル 手順書.docx
            readonly: true
          - word: docs/サンプル 手順書.docx
            label: ''
            icon: pencil-line
            tooltip: 編集モードで開く
  - break
  # select・radio・checkbox: 選んだ値を ${select:ID} や ctx.select.ID で使う
  # 値はページの中のどこからでも参照できるので、種類ごとにグループを分けて置ける
  - group: 選択（select）
    icon: list
    items:
      - select: target
        label: 接続先
        options:
          - dev
          - stg
          - { label: 本番, value: prod }
        tooltip: 選択肢は記憶します
        remember: true # 開き直しても前の選択を使う
        change: onTargetChange # 値を変えたときに呼ぶ関数（sample-scripts.js）
  - group: ラジオボタン（radio）
    icon: circle-dot
    items:
      - radio: mode
        label: モード
        options: [debug, release]
        # remember を書かないので、開くたびに debug に戻る
  - group: チェックボックス（checkbox）
    icon: square-check
    items:
      - checkbox: dry
        label: 試しに実行
        on: --dry-run # オンのときの値
        off: '' # オフのときの値（空）
        remember: true
  - group: 選んだ値を使う
    icon: server
    items:
      - sh: echo "接続先=${select:target} モード=${select:mode} ${select:dry}"
        bat: |
          @echo off
          echo 接続先=${select:target} モード=${select:mode} ${select:dry}
        label: 値を表示
        env:
          TARGET_ENV: ${select:target}
      - function: showSelect
        confirm: ${select:target} の値で関数を呼びますか？
