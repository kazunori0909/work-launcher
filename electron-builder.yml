appId: io.github.kazunori0909.worklauncher
productName: WorkLauncher
directories:
  buildResources: build
# アプリに入れるものだけを並べる（実行時の依存の node_modules は electron-builder が足す）
files:
  - out/**
  - resources/**
  - package.json
# 画面のライブラリ（react・lucide-react など）はビルドで画面の JS に取り込むため、package.json では
# devDependencies に置く。dependencies にはメインプロセスが実行時に読むものだけを置く（アプリに入る）
# Electron の言語ファイルは日本語と英語だけ入れる（en-US は Windows で読めないときの予備）
electronLanguages: [ja, en, en-US]
compression: maximum
asarUnpack:
  - resources/**
# 配布版の Electron の機能を絞る（Node として動かす・外から Node のオプションやデバッガを渡す・asar の外や改ざんした asar から読む、を止める）。
# grantFileProtocolExtraPrivileges は残す（画面を file:// の module script で読んでいるため）
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# アプリ自体のライセンス文をアプリのフォルダに置く（Electron・Chromium の分は electron-builder が残す）
extraResources:
  - from: LICENSE
    to: LICENSE.txt
# インストール版だけが関連付ける（ポータブル版は関連付けない）
fileAssociations:
  - ext: launcher
    name: WorkLauncher Project
    role: Viewer
    rank: Owner
    icon: document
win:
  executableName: WorkLauncher
  target:
    - nsis
    - portable
portable:
  artifactName: ${name}-${version}-win-${arch}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-win-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  # 署名はしない。Apple Silicon は署名の無いアプリを開けないため ad-hoc 署名だけする（公証しないので hardened runtime も要らない）
  identity: '-'
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
