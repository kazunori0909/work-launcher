# 出てすぐの版は避け、7 日たったものだけ上げる（乗っ取られた版を掴みにくくする）
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # アプリは Electron の Node（Electron 45 は 24）で動く。型だけ上げると 24 に無い API を書けてしまう
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
