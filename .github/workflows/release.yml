# v* のタグを push すると、Windows・macOS でビルドして下書きの Release に添付する。
# 手動実行（workflow_dispatch）ではビルドだけして、成果物を Actions の Artifacts に置く
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 書き込めるのは release ジョブだけ（ジョブごとに付ける）
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: タグと package.json のバージョンが合っているか
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と package.json のバージョン $version が違います"
            exit 1
          fi

      # Node は mise.toml のバージョンに揃える
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - run: npm ci
      - run: npm test
      - run: npm run build:${{ matrix.target }} -- --publish never

      # electron-builder が選べる圧縮（bzip2）より LZMA（ULMO）のほうが 2 割ほど小さい。
      # ULMO は macOS 10.15 以降で開けるが、Electron 自体が macOS 12 以降でしか動かないので困らない
      - name: Mac の dmg を LZMA で圧縮し直す
        if: matrix.target == 'mac'
        run: |
          for f in dist/*.dmg; do
            hdiutil convert "$f" -format ULMO -o "${f%.dmg}-ulmo.dmg"
            mv -f "${f%.dmg}-ulmo.dmg" "$f"
          done

      # electron-builder の ${arch} は arm64・x64 しか出せないため、利用者に分かる名前をここで足す
      - name: Mac の dmg の名前に Apple Silicon・Intel を足す
        if: matrix.target == 'mac'
        run: |
          for f in dist/*-mac-arm64.dmg; do mv "$f" "${f%-arm64.dmg}-apple-silicon-arm64.dmg"; done
          for f in dist/*-mac-x64.dmg; do mv "$f" "${f%-x64.dmg}-intel-x64.dmg"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*-setup.exe
            dist/*-portable.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Environment release はタグ v* からしか使えない（GitHub の設定）
    environment: release
    permissions:
      contents: write # Release を作る
      id-token: write # attestation の署名に使う
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # 追跡しているファイルだけを入れる（個人用の *.local.yaml は入らない）
      - name: サンプル案件の zip
        run: git archive --format=zip --prefix=sample/ -o "dist/work-launcher-sample-${GITHUB_REF_NAME#v}.zip" HEAD:examples/sample

      # 署名が無いため、ダウンロードしたファイルが同じものか確かめられるようにハッシュを添える
      - name: SHA256 の一覧
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      # このリポジトリのワークフローでビルドしたことを、gh attestation verify で確かめられるようにする
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: 下書きの Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        # 冒頭にダウンロードの案内（.github/release-notes.md）を置き、その後ろに GitHub が変更点の一覧を足す
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -e "s/{{version}}/$version/g" -e "s#{{repo}}#$GITHUB_REPOSITORY#g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
