# PR と main への push で、lint・typecheck・test を Mac と Windows で流す。
# main の Ruleset は、このジョブ（check (macos-latest)・check (windows-latest)）が通ることを必須にしている
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node は mise.toml のバージョンに揃える
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
