# PR で、lint・typecheck・test を Mac と Windows で流す。
# ビルドに関係しないファイルだけの変更なら check を飛ばす（→ docs/archive/phase17-ci-path-filter/PLAN.md）。
# main への push では流さない。PR で確かめた中身がそのまま main になるため（→ docs/archive/phase19-ci-dedupe/PLAN.md）。
# main の Ruleset は ci-ok ジョブが通ることを必須にしている
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # 除外リストに当たらないファイルが1つでもあれば流す。diff が取れないときも流す
      - id: diff
        env:
          # PR はマージ後のコミットを取り出すので、1つ目の親（マージ先）と比べる
          BASE: HEAD^1
        run: |
          code=true
          if files=$(git diff --name-only "$BASE" HEAD); then
            code=false
            while IFS= read -r f; do
              case "$f" in
                docs/* | README.md | AGENTS.md | CLAUDE.md | SECURITY.md | .claude/* | .vscode/* | \
                  .github/release-notes.md | .github/dependabot.yml) ;;
                *)
                  echo "流す理由: $f"
                  code=true
                  break
                  ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node は mise.toml のバージョンに揃える
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # 必須チェックはこの1つ。check が飛ばされたときも通す
  ci-ok:
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
